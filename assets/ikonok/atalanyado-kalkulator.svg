<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Átalányadó-kalkulátor">
  <title>Átalányadó-kalkulátor</title>

  <!-- Naptár, mert ez a kalkulátor az egész évről szól: az adómentes rész göngyölítve fogy,
       a járulékalap negyedévente áll össze. A fejlécből a „%" kivágva — az átalányadó lényege
       a költséghányad. A jel mértani formákból áll, nem szövegből: az SVG képként rajzolva
       nem tud webfontot betölteni. -->
  <defs>
    <mask id="szazalek-kivagas">
      <path d="M113 136a27 27 0 0 1 27-27h232a27 27 0 0 1 27 27v53H113z" fill="#fff"/>
      <circle cx="234" cy="133" r="12" fill="#000"/>
      <circle cx="278" cy="165" r="12" fill="#000"/>
      <line x1="224" y1="172" x2="288" y2="126" stroke="#000" stroke-width="13" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Fűzőkarikák: ettől lesz a sziluett első pillantásra naptár, nem számológép -->
  <g fill="none" stroke="#02023B" stroke-width="18" stroke-linecap="round">
    <path d="M176 64v42"/>
    <path d="M336 64v42"/>
  </g>

  <!-- A naptár teste -->
  <rect x="104" y="100" width="304" height="348" rx="36"
        fill="none" stroke="#02023B" stroke-width="18"/>

  <!-- A fejléc: az egyetlen tömör felület -->
  <path d="M113 136a27 27 0 0 1 27-27h232a27 27 0 0 1 27 27v53H113z"
        fill="#02023B" mask="url(#szazalek-kivagas)"/>

  <!-- Sorok -->
  <g fill="none" stroke="#02023B" stroke-width="10" stroke-linecap="round">
    <path d="M152 258h208"/>
    <path d="M152 314h208"/>
    <path d="M152 370h128"/>
  </g>
</svg>
